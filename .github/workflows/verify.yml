name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Clone upstream v0.77.0
        run: git -c core.autocrlf=false clone --depth 1 --branch v0.77.0 https://github.com/nightly-labs/openbot.git openbot

      - name: Apply patch
        run: |
          git -C openbot apply --check ../patches/character-art-v0.77.0.patch
          git -C openbot apply ../patches/character-art-v0.77.0.patch

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: openbot
        timeout-minutes: 30
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: openbot
        timeout-minutes: 30
        run: |
          bun run typecheck:node
          bun run typecheck:renderer
          bun run typecheck:contracts
          bun run typecheck:i18n
          bun run typecheck:mobile

      - name: Patch tests
        working-directory: openbot
        timeout-minutes: 20
        run: bun run test:desktop -- src/main/ipc-channel-coverage.test.ts src/renderer/src/features/sidebar/MariAvatar.test.tsx apps/mobile/src/features/agents/model/mari-motion.test.ts

  ios:
    runs-on: macos-latest
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Clone upstream v0.77.0
        run: git -c core.autocrlf=false clone --depth 1 --branch v0.77.0 https://github.com/nightly-labs/openbot.git openbot

      - name: Apply patch
        run: |
          git -C openbot apply --check ../patches/character-art-v0.77.0.patch
          git -C openbot apply ../patches/character-art-v0.77.0.patch

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: openbot
        timeout-minutes: 30
        run: bun install --frozen-lockfile

      - name: Expo prebuild (iOS)
        working-directory: openbot/apps/mobile
        timeout-minutes: 30
        run: bunx expo prebuild --platform ios --no-install

      - name: Pod install
        working-directory: openbot/apps/mobile/ios
        timeout-minutes: 30
        run: pod install --repo-update

      - name: Build for iOS Simulator (unsigned)
        working-directory: openbot/apps/mobile/ios
        timeout-minutes: 90
        run: xcodebuild -workspace OpenBot.xcworkspace -scheme OpenBot -configuration Debug -destination "generic/platform=iOS Simulator" -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Clone upstream v0.77.0
        run: git -c core.autocrlf=false clone --depth 1 --branch v0.77.0 https://github.com/nightly-labs/openbot.git openbot

      - name: Apply patch
        run: |
          git -C openbot apply --check ../patches/character-art-v0.77.0.patch
          git -C openbot apply ../patches/character-art-v0.77.0.patch

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        working-directory: openbot
        timeout-minutes: 30
        run: bun install --frozen-lockfile

      - name: Expo prebuild (Android)
        working-directory: openbot/apps/mobile
        timeout-minutes: 30
        run: bunx expo prebuild --platform android --no-install

      - name: Gradle assembleDebug (unsigned)
        working-directory: openbot/apps/mobile/android
        timeout-minutes: 60
        run: ./gradlew assembleDebug --stacktrace --console=plain

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: openbot/apps/mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  android-emulator:
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 45
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install APK, launch, capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install -r "$(find "$GITHUB_WORKSPACE" -name 'app-debug.apk' -print -quit)"
            adb shell monkey -p run.openbot.mobile -c android.intent.category.LAUNCHER 1
            sleep 30
            adb shell screencap -p /sdcard/launch.png
            adb pull /sdcard/launch.png emulator-launch.png

      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-screenshot
          path: emulator-launch.png
          if-no-files-found: warn
